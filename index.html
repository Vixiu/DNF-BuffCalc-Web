<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DNF 辅助职业奶量计算器 - 主人专属喵~</title>
<style>
  /* ==========================================
   ☀️ 1. 浅色 / 🌙 暗色 主题变量声明
   ========================================== */
:root {
  --bg-color: #f0f2f5;
  --card-bg: #ffffff;
  --card-inner: #f8f9fa;
  --primary: #d97706;
  --text-main: #1f2937;
  --text-muted: #6b7280;
  --border-color: #e5e7eb;
  --input-bg: #ffffff;
  --input-disabled-bg: #e5e7eb;
  --output-bg: #f3f4f6;
  --accent-blue: #2563eb;
  --accent-pink: #9333ea;
  --accent-green: #16a34a;
  --accent-purple: #9333ea;
  --btn-base-bg: rgba(217, 119, 6, 0.1);
  --btn-base-border: #d97706;
  --btn-base-text: #d97706;
}

body.dark-theme {
  --bg-color: #0f111a;
  --card-bg: #1a1d2e;
  --card-inner: #24283b;
  --primary: #ff9e3b;
  --text-main: #c0caf5;
  --text-muted: #7982a9;
  --border-color: #2f354f;
  --input-bg: #0f111a;
  --input-disabled-bg: #141724;
  --output-bg: rgba(0, 0, 0, 0.25);
  --accent-blue: #7aa2f7;
  --accent-pink: #bb9af7;
  --accent-green: #9ece6a;
  --accent-purple: #c084fc;
  --btn-base-bg: rgba(255, 158, 59, 0.15);
  --btn-base-border: #ff9e3b;
  --btn-base-text: #ff9e3b;
}

/* ==========================================
   🛠️ 2. 全局重置与基础布局
   ========================================== */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}

/* 🚫 隐藏所有数字输入框微调箭头 */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.calculator-container {
  width: 96%;
  max-width: 1700px;
  background: var(--card-bg);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  padding: 28px;
  border: 1px solid var(--border-color);
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.header-title {
  margin: 0;
  color: var(--primary);
  font-size: 24px;
}

.theme-toggle-btn {
  background: var(--card-inner);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
}

/* ==========================================
   👔 3. 职业选择与配置栏
   ========================================== */
.job-select-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.job-select-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}

.job-select-container label {
  font-weight: bold;
  color: var(--text-main);
  font-size: 15px;
  white-space: nowrap;
}

.job-select {
  flex: 1;
  max-width: 280px;
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  outline: none;
  cursor: pointer;
}

.config-action-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-save-config {
  background: rgba(37, 99, 235, 0.1);
  border: 1px solid var(--accent-blue);
  color: var(--accent-blue);
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-save-config:hover {
  background: var(--accent-blue);
  color: #ffffff;
}

.config-load-select {
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  outline: none;
  cursor: pointer;
  min-width: 160px;
}

/* ==========================================
   📦 4. 面板与 Form 网格结构
   ========================================== */
.inputs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
  align-items: stretch;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel {
  background: var(--card-inner);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border-color);
}

.panel-subtitle {
  font-size: 15px;
  font-weight: bold;
  color: var(--primary);
  margin-top: 0;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 8px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 13px;
  color: var(--text-muted);
}

.form-group input {
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 14px;
  height: 38px;
  outline: none;
  width: 100%;
}

.form-group input:focus {
  border-color: var(--primary);
}

/* 🚫 输入框禁用统一样式 */
.buff-pct-item input:disabled,
.form-group input:disabled {
  background-color: var(--input-disabled-bg) !important;
  color: var(--text-muted) !important;
  border-color: var(--border-color) !important;
  cursor: not-allowed !important;
  opacity: 0.7 !important;
  user-select: none !important;
}

/* ==========================================
   ✨ 5. 核心技能行 (统一 1px 翡翠绿边框 #10b981)
   ========================================== */
.passive-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.passive-input-row input {
  flex: 1 !important;
  width: 100% !important;
  border: 1px solid #10b981 !important;
  color: var(--text-main);
  border-radius: 8px;
}

.passive-input-row input:focus {
  border-color: #10b981 !important;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
}

.passive-stat-tip {
  font-size: 13px;
  font-weight: bold;
  color: #10b981;
  white-space: nowrap;
  user-select: none;
}

.passive-stat-tip.negative {
  color: #ef4444;
}

.btn-apply-passive {
  white-space: nowrap;
  padding: 0 12px;
  height: 38px;
  font-size: 13px;
  font-weight: bold;
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid #10b981;
  color: #10b981;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
}

.btn-apply-passive:hover {
  background: #10b981;
  color: #ffffff;
}

.btn-apply-passive:active {
  transform: scale(0.95);
}

.btn-apply-passive.applied-success {
  background-color: #059669 !important;
  border-color: #059669 !important;
  color: #ffffff !important;
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
  transform: scale(1.02);
}

/* ==========================================
   ✨ 6. 胶囊单选组 (Segmented Control)
   ========================================== */
.segmented-control {
  display: flex;
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 3px;
  gap: 4px;
  height: 38px;
  width: 100%;
}

.segmented-control label {
  flex: 1;
  display: flex;
  margin: 0;
  padding: 0;
  cursor: pointer;
}

.segmented-control input[type="radio"] {
  position: absolute !important;
  opacity: 0 !important;
  width: 0 !important;
  height: 0 !important;
  pointer-events: none !important;
}

.segmented-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  color: var(--text-muted);
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
  height: 100%;
  width: 100%;
}

.segmented-btn:hover {
  color: var(--text-main);
  background: rgba(217, 119, 6, 0.08);
}

.segmented-control input[type="radio"]:checked + .segmented-btn {
  background: var(--primary) !important;
  color: #ffffff !important;
  box-shadow: 0 2px 6px rgba(217, 119, 6, 0.3);
}

/* ==========================================
   🌟 7. 中间带文字的嵌入式分割线 (加粗加深版)
   ========================================== */
.panel-divider-text {
  grid-column: span 2;
  display: flex;
  align-items: center;
  margin: 12px 0 8px 0;
  font-size: 13px;
  font-weight: bold;
  color: var(--primary);
}

.panel-divider-text::before,
.panel-divider-text::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid var(--border-color);
  opacity: 1;
}

body.dark-theme .panel-divider-text::before,
body.dark-theme .panel-divider-text::after {
  border-bottom-color: rgba(255, 255, 255, 0.35);
}

.panel-divider-text::before {
  margin-right: 12px;
}

.panel-divider-text::after {
  margin-left: 12px;
}

.panel-divider-text span {
  white-space: nowrap;
  user-select: none;
}

/* ==========================================
   🔮 8. 辟邪玉矩阵网格
   ========================================== */
.jade-matrix-grid {
  display: grid;
  grid-template-columns: max-content 1fr;
  column-gap: 32px;
  row-gap: 16px;
  align-items: start;
}

.jade-matrix-grid .form-group label {
  font-size: 14px !important;
  font-weight: bold !important;
  color: var(--text-main) !important;
  white-space: nowrap;
}

.jade-matrix-grid .inputs-container {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
}

.jade-matrix-grid input,
.jade-matrix-grid .compact-input {
  background: transparent !important;
  border: none !important;
  border-bottom: 2px solid var(--border-color) !important;
  border-radius: 0 !important;
  color: var(--text-main);
  padding: 4px 2px !important;
  font-size: 14px;
  height: 34px;
  outline: none;
  text-align: center;
  font-weight: bold;
  width: 95px !important;
  transition: border-color 0.2s ease, border-bottom-width 0.2s ease;
}

.jade-matrix-grid input:hover:not(:disabled) {
  border-bottom-color: var(--primary) !important;
  border-bottom-width: 3px !important;
}

.jade-matrix-grid input:focus {
  border-bottom-color: var(--primary) !important;
  border-bottom-width: 3px !important;
}

/* ==========================================
   🧮 9. 开关与算式行
   ========================================== */
.toggle-switch-container {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
}

.switch {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 20px;
  flex-shrink: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: var(--border-color);
  transition: .3s;
  border-radius: 20px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .3s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--primary);
}

input:checked + .slider:before {
  transform: translateX(18px);
}

.buff-pct-row {
  display: flex !important;
  flex-direction: row !important;
  align-items: flex-end;
  gap: 8px;
  width: 100%;
}

.buff-pct-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.buff-pct-item label {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
}

.buff-pct-item input {
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  height: 38px;
  outline: none;
  width: 100%;
}

.buff-pct-item input.jade-disabled-input {
  background: var(--input-disabled-bg) !important;
  color: var(--accent-purple) !important;
  border-color: var(--border-color) !important;
  cursor: not-allowed;
}

.buff-pct-operator {
  font-size: 18px;
  font-weight: bold;
  color: var(--primary);
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 2px;
}

/* ==========================================
   📊 10. 结算表格与响应式
   ========================================== */
.output-box {
  background: var(--output-bg);
  border-radius: 12px;
  padding: 24px;
  border: 1px solid var(--border-color);
  width: 100%;
}

.output-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.output-header h3 {
  margin: 0;
  font-size: 18px;
  color: var(--primary);
}

.btn-set-base {
  background: var(--btn-base-bg);
  border: 1px solid var(--btn-base-border);
  color: var(--btn-base-text);
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  user-select: none;
}

.result-table-wrapper {
  width: 100%;
  overflow-x: auto;
}

.result-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-inner);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border-color);
  text-align: center;
}

.result-table th {
  background: rgba(217, 119, 6, 0.08);
  color: var(--primary);
  padding: 14px 16px;
  font-size: 15px;
  font-weight: bold;
  border-bottom: 1px solid var(--border-color);
  width: 25%;
}

.result-table td {
  padding: 14px 16px;
  font-size: 15px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-main);
  font-weight: 500;
}

.result-table td.skill-name {
  font-weight: bold;
  text-align: left;
  padding-left: 24px;
}

.result-table td.val-highlight {
  font-weight: bold;
  font-size: 17px;
  color: var(--accent-green);
}

.result-table td.rate-highlight {
  font-weight: bold;
  font-size: 17px;
  color: var(--accent-purple);
}

@media (max-width: 860px) {
  body { padding: 8px; }
  .calculator-container { width: 100%; padding: 16px; }
  .inputs-grid { grid-template-columns: 1fr; gap: 16px; }
  .jade-matrix-grid { grid-template-columns: 1fr; }
  .job-select-container { flex-direction: column; align-items: stretch; }
  .config-action-right { justify-content: flex-end; }
}
</style>
</head>



<body>

<div class="calculator-container">
  <div class="top-bar">
    <h1 class="header-title">⚔️ DNF 奶量计算器</h1>
    <button class="theme-toggle-btn" id="themeBtn">🌙 暗色主题</button>
  </div>

  <div class="job-select-container">
    <div class="job-select-left">
      <label for="jobSelect">职业选择：</label>
      <select id="jobSelect" class="job-select">
        <option value="ma">⚡ 奶妈（女圣骑）</option>
        <option value="ba">✝️ 奶爸（男圣骑）</option>
        <option value="luo">🧸 奶萝（小魔女）</option>
        <option value="gong">🏹 奶弓（缪斯）</option>
        <option value="qiang">🔫 奶枪（协战师）</option>
      </select>
    </div>

    <div class="config-action-right">
      <button class="btn-save-config" id="btnSaveConfig">💾 保存</button>
      <select id="configLoadSelect" class="config-load-select">
        <option value="" disabled selected>📁 读取</option>
        <option value="config1">预设 1: 毕业打造方案</option>
        <option value="config2">预设 2: 平民打造方案</option>
      </select>
    </div>
  </div>

  <div class="inputs-grid">

    <!-- ⬅️ 左侧栏：基础面板与适用修正 -->
    <div class="column">

      <!-- 1. ⚙️ 角色基础 (图外) -->
   <div class="panel">
  <div class="panel-subtitle">⚙️ 角色基础 (图外)</div>

  <div class="form-grid">
    <div class="form-group">
      <label>站街四维</label>
      <input type="number" id="buffStat" value="10000" inputmode="numeric" placeholder="请输入站街面板四维">
    </div>

    <div class="form-group">
      <label>增益量</label>
      <input type="number" id="buffBuff" value="200000" inputmode="numeric" placeholder="请输入站街增益量">
    </div>

    <div class="form-group">
      <label>Buff 等级</label>
      <input type="number" id="buffLv" value="50" inputmode="numeric" placeholder="请输入 Buff 等级">
    </div>

    <!-- ✨ 核心技能 -->
    <div class="form-group">
      <label id="skillLv1Label">Lv15 核心技能</label>
      <div class="passive-input-row">
        <input type="number" id="skillLv1" value="10" placeholder="10" min="1" max="100" inputmode="numeric">
        <span class="passive-stat-tip" id="skillLv1StatTip"></span>
        <button type="button" class="btn-apply-passive" id="btnApplyPassive">✨ 设为基准</button>
      </div>
    </div>

    <!-- 🌟 中间带文字的横向分割线 -->
    <div class="panel-divider-text">
      <span>🧮 自动推算</span>
    </div>

    <!-- ✨ 白金数量 -->
    <div class="form-group">
      <label>Lv15 被动白金数量</label>
      <div class="segmented-control">
        <label>
          <input type="radio" name="passPlatinum15" value="0" checked>
          <span class="segmented-btn">没有</span>
        </label>
        <label>
          <input type="radio" name="passPlatinum15" value="1">
          <span class="segmented-btn">1 个</span>
        </label>
        <label>
          <input type="radio" name="passPlatinum15" value="2">
          <span class="segmented-btn">2 个</span>
        </label>
      </div>
    </div>

    <!-- ✨ 训练教官 -->
    <div class="form-group">
      <label>训练教官</label>
      <div class="segmented-control">
        <label>
          <input type="radio" name="trainerInstructor" value="0" checked>
          <span class="segmented-btn">未开启</span>
        </label>
        <label>
          <input type="radio" name="trainerInstructor" value="1">
          <span class="segmented-btn">已开启</span>
        </label>
      </div>
    </div>

    <!-- ✨ 新增固定推算项：黄金乡 -->
    <div class="form-group">
      <label>黄金乡</label>
      <div class="segmented-control">
        <label>
          <input type="radio" name="goldenLand" value="0" checked>
          <span class="segmented-btn">红10及下</span>
        </label>
        <label>
          <input type="radio" name="goldenLand" value="11">
          <span class="segmented-btn">红11</span>
        </label>
        <label>
          <input type="radio" name="goldenLand" value="12">
          <span class="segmented-btn">红12+</span>
        </label>
      </div>
    </div>

    <!-- 📌 动态预留插槽 -->
    <div id="jobCustomCategorySlots" style="grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"></div>
  </div>
</div>



      <!-- 2. 🛡️ 图内适用修正 -->
      <div class="panel">
        <div class="panel-subtitle" style="color: var(--accent-blue);">
          <span>🛡️ 图内适用修正</span>
          <label class="toggle-switch-container">
            <span id="autoCalcStatusText">自动推算 (开启)</span>
            <div class="switch">
              <input type="checkbox" id="autoCalcSwitch" checked>
              <span class="slider"></span>
            </div>
          </label>
        </div>
        <div class="form-grid">
          <div class="form-group">

  // 主题切换
function initTheme() {
  const themeBtn = document.getElementById('themeBtn');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'dark') {
    document.body.classList.add('dark-theme');
    if (themeBtn) themeBtn.textContent = '☀️ 浅色主题';
  } else {
    document.body.classList.remove('dark-theme');
    if (themeBtn) themeBtn.textContent = '🌙 暗色主题';
  }

  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-theme');
      themeBtn.textContent = isDark ? '☀️ 浅色主题' : '🌙 暗色主题';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  }
}
// 模式与正反算逻辑
function initBuffMode() {
  const modeSwitch = document.getElementById('modeSwitch');
  const modeStatusText = document.getElementById('modeStatusText');
  const baseBuffPct = document.getElementById('baseBuffPct');
  const totalBuffPct = document.getElementById('totalBuffPct');

  function updateModeState() {
    if (!modeSwitch || !baseBuffPct || !totalBuffPct) return;
    if (modeSwitch.checked) {
      if (modeStatusText) modeStatusText.textContent = '输入包含辟邪玉 (填总数)';
      totalBuffPct.disabled = false;
      baseBuffPct.disabled = true;
    } else {
      if (modeStatusText) modeStatusText.textContent = '输入不含辟邪玉 (填基础)';
      baseBuffPct.disabled = false;
      totalBuffPct.disabled = true;
    }
  }

  if (modeSwitch) {
    modeSwitch.addEventListener('change', updateModeState);
    updateModeState();
  }
}

  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    initBuffMode();
